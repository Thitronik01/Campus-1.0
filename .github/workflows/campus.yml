name: Campus CI/CD

# Actions sind auf vollständige Commit-SHAs gepinnt, der Tag steht als
# Kommentar dahinter. Ein Tag ist in Git verschiebbar; ein SHA nicht.
# tools/check-deploy.js prüft das bei jedem Lauf, Dependabot hält die SHAs
# aktuell (.github/dependabot.yml).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Campus-Paket prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # montag.js baut beide Paketformen und lässt alles laufen: Syntax,
      # Fragensätze, Medienbudget, Bewertungslogik, THI, Deploy-Konfiguration
      # und die Paketprüfungen je Insel.
      - name: Fragen, Logik, Medien und Pakete prüfen
        working-directory: Campus Quiz
        run: node tools/montag.js --ohne-server

      - name: Geprüftes Gesamtpaket speichern
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: campus-gesamtpaket
          path: Campus Gesamtpaket
          if-no-files-found: error
          retention-days: 14

  # Läuft nur, wenn NETLIFY_AUTH_TOKEN und NETLIFY_SITE_ID als Secrets
  # gesetzt sind. Solange Netlify die Site selbst aus dem Repository baut,
  # bleibt dieser Job ein vorbereiteter zweiter Weg — nicht beide zugleich
  # betreiben, sonst deployt jeder Push zweimal.
  deploy:
    name: Netlify Produktion
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.netlify_deploy.outputs.url }}

    steps:
      # Die Secrets hängen an den Schritten, die sie brauchen — nicht am Job.
      # Sonst läge der Produktions-Token auch in der Umgebung von checkout,
      # setup-node und npm ci.
      - name: Deployment-Konfiguration prüfen
        id: deploy_config
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [[ -n "$NETLIFY_AUTH_TOKEN" && -n "$NETLIFY_SITE_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Netlify-Deploy vorbereitet::Für den automatischen Produktionsdeploy fehlen NETLIFY_AUTH_TOKEN und NETLIFY_SITE_ID als GitHub-Secrets."
            {
              echo "### Netlify-Deploy vorbereitet"
              echo
              echo "Der geprüfte Build ist als Artefakt verfügbar. Der Produktionsdeploy startet automatisch, sobald die Repository-Secrets \`NETLIFY_AUTH_TOKEN\` und \`NETLIFY_SITE_ID\` gesetzt sind."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Nur das Lockfile der Netlify-CLI, nicht das ganze Repository: Der
      # Deploy-Job braucht den Quellcode nicht, er bekommt das geprüfte
      # Paket als Artefakt.
      - name: Netlify-CLI-Lockfile laden
        if: steps.deploy_config.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy/netlify-cli

      - name: Node.js einrichten
        if: steps.deploy_config.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: deploy/netlify-cli/package-lock.json

      # npm ci statt npx: Das Lockfile schreibt jeden Baustein samt
      # Integritätshash fest. Mit npx würde der Abhängigkeitsbaum bei jedem
      # Deploy neu aufgelöst — in dem Job, der den Produktions-Token kennt.
      - name: Netlify-CLI aus dem Lockfile installieren
        if: steps.deploy_config.outputs.enabled == 'true'
        working-directory: deploy/netlify-cli
        run: npm ci --no-audit --no-fund

      - name: Geprüftes Gesamtpaket laden
        if: steps.deploy_config.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: campus-gesamtpaket
          path: Campus Gesamtpaket

      - name: Nach Netlify Production deployen
        id: netlify_deploy
        if: steps.deploy_config.outputs.enabled == 'true'
        working-directory: Campus Gesamtpaket
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail

          # Token und Site-ID kommen aus der Umgebung; die CLI liest beide
          # selbst. Als Argument stünde der Token in der Prozessliste.
          NETLIFY="$GITHUB_WORKSPACE/deploy/netlify-cli/node_modules/.bin/netlify"

          DEPLOY_JSON="$("$NETLIFY" deploy \
            --prod \
            --dir=public \
            --functions=netlify/functions \
            --message="GitHub ${GITHUB_SHA}" \
            --json)"

          printf '%s\n' "$DEPLOY_JSON"

          DEPLOY_URL="$(printf '%s' "$DEPLOY_JSON" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              process.stdout.write(result.deploy_ssl_url || result.deploy_url || result.url || "");
            });
          ')"

          if [[ -z "$DEPLOY_URL" ]]; then
            echo "Netlify hat keine Deploy-URL zurückgegeben." >&2
            exit 1
          fi

          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Netlify-Produktion aktualisiert"
            echo
            echo "[$DEPLOY_URL]($DEPLOY_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
